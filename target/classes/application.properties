spring.application.name=cliente-service
server.port=${PORT:8081}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/db_minimarket?createDatabaseIfNotExist=true&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false}

spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
## lo saque pq me daba problemas con mariadb
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.output.ansi.enabled=always

spring.jpa.open-in-view = false
jwt.secret=porotosconriendasyfideosconsalsapapasfritas12345test

##LOGSSSSSSSSSSSS CONFIG

#Nivel general
#logging.level.root=WARN

logging.level.com.minimarket=DEBUG

#formato
logging.pattern.console=%d{HH:mm:ss} [%level] %logger{20}: %msg%n

#este esta bn  pq te crea un archivo
logging.file.name = logs/cliente-service.log

logging.file.max-size = 10MB
logging.file.max-history = 30

##urnotifiacon
notificacion.service.url=${NOTIFICACION_SERVICE_URL:http://localhost:8089}

# Swagger / OpenAPI
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/doc/swagger-ui.html
# Eureka Client
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
management.endpoints.web.exposure.include=health,info


# Railway: permite desactivar Eureka si usas URLs directas
eureka.client.enabled=${EUREKA_CLIENT_ENABLED:true}
